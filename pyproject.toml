[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "projector-cal"
version = "0.1.0"
description = "Closed-loop projector calibration for Epson 5040UB"
requires-python = ">=3.10"
dependencies = [
    "python-colormath>=3.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "anthropic>=0.34.0",
    "zeroconf>=0.131.0",
    "netifaces>=0.11.0",
]

[project.optional-dependencies]
serial = [
    "pyserial>=3.5",
]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "httpx>=0.27.0",
    "pyserial>=3.5",
]

[project.scripts]
projector-cal = "projector_cal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["projector_cal*"]
